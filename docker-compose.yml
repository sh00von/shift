services:

  # ── Python / FastAPI analysis engine ────────────────────────────────────────
  # Give this service its own Dokploy domain (container port 7766).
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "7766"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:7766/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Next.js frontend ─────────────────────────────────────────────────────────
  # Give this service its own Dokploy domain (container port 6767).
  # NEXT_PUBLIC_API_BASE must point at the backend's public domain — it's
  # baked into the client bundle at build time, so set it as a build arg too.
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
    expose:
      - "6767"
    environment:
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE}
    depends_on:
      - backend
    restart: unless-stopped
