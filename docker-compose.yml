services:

  # ── Reverse proxy (single entry point for Dokploy/Traefik) ─────────────────
  # Dokploy routes external traffic to this service on port 6677 — set 6677
  # as the container port in the Dokploy domain/proxy settings for this app.
  # Caddy proxies /api/* → backend and everything else → frontend.
  # HTTPS/TLS is terminated upstream by Dokploy's Traefik — Caddy stays plain HTTP.
  caddy:
    image: caddy:2-alpine
    expose:
      - "6677"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

  # ── Python / FastAPI analysis engine ────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "7766"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:7766/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Next.js frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    expose:
      - "6767"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
