[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shift"
version = "0.2.0"
description = "Statistical changepoint framework for shoreline rate analysis"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "numpy>=1.26",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "ruptures>=1.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pymc>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]
app = ["PySide6>=6.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["shift*", "app*"]
